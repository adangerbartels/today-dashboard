[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "today-dashboard"
version = "1.0.0"
description = "A one-screen dashboard of the work that actually needs you: calendar, Jira, GitHub, Gmail, Slack."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["dashboard", "jira", "github", "gmail", "slack", "calendar", "productivity"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Environment :: Web Environment",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Scheduling",
  "Topic :: Utilities",
]

# Deliberately empty. The whole point is that this runs anywhere Python does,
# with nothing to install and no supply chain to trust with your API tokens.
dependencies = []

[project.urls]
Homepage = "https://github.com/adangerbartels/today-dashboard"
Issues = "https://github.com/adangerbartels/today-dashboard/issues"

[project.scripts]
today = "today_dashboard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
today_dashboard = ["static/*"]
